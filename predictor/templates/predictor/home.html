<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>House Rent Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #222;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background-color: #e8f5e9;
            border: 1px solid #a5d6a7;
            border-radius: 8px;
            text-align: center;
            color: #1b5e20;
        }

        .result h2 {
            margin: 0;
            font-size: 22px;
        }

        .result p {
            margin-top: 10px;
            font-size: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>House Rent Prediction</h1>

        <form method="POST">

            {% csrf_token %}

            <!-- Location -->
            <label for="location">Location</label>

            <input
                type="text"
                id="location"
                name="location"
                placeholder="Example: Dhanmondi"
                required
            >


            <!-- Bedrooms -->
            <label for="bedrooms">Bedrooms</label>

            <input
                type="number"
                id="bedrooms"
                name="bedrooms"
                min="1"
                placeholder="Example: 3"
                required
            >


            <!-- Bathrooms -->
            <label for="bathrooms">Bathrooms</label>

            <input
                type="number"
                id="bathrooms"
                name="bathrooms"
                min="1"
                placeholder="Example: 2"
                required
            >


            <!-- Size -->
            <label for="size">Size (sq ft)</label>

            <input
                type="number"
                id="size"
                name="size"
                min="100"
                placeholder="Example: 1200"
                required
            >


            <!-- Floor -->
            <label for="floor">Floor</label>

            <input
                type="number"
                id="floor"
                name="floor"
                min="1"
                placeholder="Example: 5"
                required
            >


            <!-- Parking -->
            <label for="parking">Parking</label>

            <select id="parking" name="parking">

                <option value="Yes">Yes</option>

                <option value="No">No</option>

            </select>


            <!-- Furnished -->
            <label for="furnished">Furnished</label>

            <select id="furnished" name="furnished">

                <option value="Yes">Yes</option>

                <option value="No">No</option>

            </select>


            <!-- Balcony -->
            <label for="balcony">Balcony</label>

            <select id="balcony" name="balcony">

                <option value="Yes">Yes</option>

                <option value="No">No</option>

            </select>


            <!-- Building Age -->
            <label for="building_age">Building Age</label>

            <input
                type="number"
                id="building_age"
                name="building_age"
                min="0"
                placeholder="Example: 5"
                required
            >


            <!-- Submit Button -->
            <button type="submit">
                Predict Rent
            </button>

        </form>


        <!-- Prediction Result -->

        {% if prediction %}

        <div class="result">

            <h2>Estimated Monthly Rent</h2>

            <p>৳{{ prediction }}</p>

        </div>

        {% endif %}

    </div>

</body>

</html>
